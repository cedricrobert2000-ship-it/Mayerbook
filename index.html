<body data-role="login">
  <!-- Écran de chargement : logo animé sur le fond -->
  <div id="splash" aria-hidden="true">
    <div class="splash-logo"><img src="icons/logo.svg" alt="" width="96" height="96"></div>
    <span class="splash-name">Mayerbook</span>
  </div>
  <script>setTimeout(function () { var s = document.getElementById('splash'); if (s) s.remove(); }, 6000);</script>

  <!-- Petites actions en haut de page (installer l'app, mode démo) — affichées seulement si utiles -->
  <div id="topnav" class="page-actions"></div>

  <main id="app" class="container"><div class="loading"><span class="spinner big"></span></div></main>

  <nav id="bottomnav" class="bottomnav" aria-label="Navigation" hidden></nav>

  <dialog id="modal"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/config.js?v=202611062219"></script>
  <script>
    // Charge Supabase seulement si l'application est configurée (sinon : mode démo)
    if (window.MAYERBOOK_CONFIG.supabaseUrl) {
      document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"><\/script>');
    }
  </script>
  <script src="js/icons.js?v=202611062219"></script>

  <script src="js/app.js?v=202611062219"></script>
  <script src="js/lesson.js?v=202611062219"></script>
